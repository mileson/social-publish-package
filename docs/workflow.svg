<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><style>text{font-family:Arial,sans-serif;fill:#183553}.title{font-size:28px;font-weight:bold}.label{font-size:19px;font-weight:bold}.body{font-size:16px}.note{font-size:14px;fill:#566d84}</style><rect width="1100" height="470" rx="26" fill="#edf5fd"/><text x="40" y="56" class="title">Video workbench / 视频预发布工作台</text><text x="40" y="87" class="note">Illustrative workflow · 结构示意 · synthetic inputs only</text><rect x="40" y="128" width="320" height="198" rx="20" fill="white" stroke="#a9c9ed"/><text x="60" y="166" class="label">1 Prepare / 准备</text><text x="60" y="206" class="body">Video + transcript</text><text x="60" y="240" class="body">5 titles / 3 bodies</text><text x="60" y="274" class="body">Relevant platform tags</text><path d="M366 224 h18 l-7 -7 m7 7 l-7 7" stroke="#3a83f7" stroke-width="3" fill="none"/><rect x="390" y="128" width="320" height="198" rx="20" fill="white" stroke="#a9c9ed"/><text x="410" y="166" class="label">2 Review / 选择</text><text x="410" y="206" class="body">Preview local media</text><text x="410" y="240" class="body">Edit titles and bodies</text><text x="410" y="274" class="body">Pick cover + tags</text><path d="M716 224 h18 l-7 -7 m7 7 l-7 7" stroke="#3a83f7" stroke-width="3" fill="none"/><rect x="740" y="128" width="320" height="198" rx="20" fill="white" stroke="#a9c9ed"/><text x="760" y="166" class="label">3 Copy / 复制</text><text x="760" y="206" class="body">Current selected text</text><text x="760" y="240" class="body">Grouped platform copy</text><text x="760" y="274" class="body">No automatic posting</text><rect x="40" y="357" width="1020" height="68" rx="16" fill="#d9eaff"/><text x="60" y="385" class="label">Optional handoff / 可选交接</text><text x="60" y="410" class="body">Selection → task JSON → check account and adapter → explicit authorization → verify result</text></svg>